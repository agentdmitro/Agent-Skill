[project]
name = "wikipedia-interest"
version = "0.1.0"
description = "Deterministic engine for Wikipedia pageview interest analysis (contracts and Wikimedia pageview fetching)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3", "httpx>=0.27,<1", "matplotlib>=3.9,<4"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikipedia_interest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]
